aid: sirius
name: Sirius
description: >-
  beSirius is an Amsterdam-based AI platform for the critical minerals and metals value
  chain. It builds a continuously verified digital Twin of every supplier, mapping each
  company's data to the frameworks, questionnaires, and regulations its buyers, auditors,
  and regulators require - including CSDDD, CMRT/EMRT/AMRT conflict-minerals reporting,
  EcoVadis, CDP, S&P CSA, UN Global Compact, LME Passport, and the Consolidated Mining
  Standard Initiative (CMSI). The platform automates supplier due diligence, sustainability
  and ESG data collection and verification, certification readiness, customer KYC, and
  ratings improvement across mining, processing, and trading supply chains, reducing manual
  audit and disclosure effort. beSirius is backed by Techstars and other investors.
